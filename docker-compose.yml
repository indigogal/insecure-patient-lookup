services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: lab
      MARIADB_USER: lab
      MARIADB_PASSWORD: lab
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./veryBadDatabase.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./docker/init/01-demo-users.sql:/docker-entrypoint-initdb.d/01-demo-users.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    image: patient-lookup:dev
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: lab
      DB_PASSWORD: lab
      DB_NAME: lab
      JWT_SECRET: dev-only-change-me
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: patient-lookup:dev
    build: .
    profiles: ["seed"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: lab
      DB_PASSWORD: lab
      DB_NAME: lab
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - ln -sf "$$(command -v mariadb)" /usr/local/bin/mysql && node migration.js

volumes:
  db_data:
